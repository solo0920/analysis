<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 248 836" width="248" height="836" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:14px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="static-investment-bs-derivation-title" aria-describedby="static-investment-bs-derivation-desc"><title id="static-investment-bs-derivation-title">Black–Scholes 推導流程</title><desc id="static-investment-bs-derivation-desc">從無套利與連續交易假設出發，以 Itô 引理建立 Black–Scholes 偏微分方程，轉為風險中立期望，得到 d1、d2 與封閉解，最後延伸到 Greeks。</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_ASSUME_ITO_0"><path d="M123.79,88L123.79,129"/><path class="pele-marker" d="M123.79,136L120.43,128L127.15,128Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_ITO_PDE_0"><path d="M123.79,196L123.79,237"/><path class="pele-marker" d="M123.79,244L120.43,236L127.15,236Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_PDE_RISK_0"><path d="M123.79,322L123.79,363"/><path class="pele-marker" d="M123.79,370L120.43,362L127.15,362Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_RISK_D1D2_0"><path d="M123.79,448L123.79,489"/><path class="pele-marker" d="M123.79,496L120.43,488L127.15,488Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_D1D2_BS_0"><path d="M123.79,592L123.79,633"/><path class="pele-marker" d="M123.79,640L120.43,632L127.15,632Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_BS_GREEKS_0"><path d="M123.79,700L123.79,741"/><path class="pele-marker" d="M123.79,748L120.43,740L127.15,740Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect accent" data-id="ASSUME" transform="translate(123.79,49)"><rect x="-81" y="-39" width="162" height="78" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);fill:#e3efeb;stroke:#0f5c5c;stroke-width:2px;"/><text class="pele-label" style="fill:#182426;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-13.1">假設</tspan><tspan x="0" y="4.9">無套利、連續交易</tspan><tspan x="0" y="22.9">常數波動率、無摩擦</tspan></text></g><g class="pele-node pele-shape-rect" data-id="ITO" transform="translate(123.79,166)"><rect x="-79.45" y="-30" width="158.91" height="60" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.1">Itô 引理</tspan><tspan x="0" y="13.9">dS、dC 的隨機微分</tspan></text></g><g class="pele-node pele-shape-rect" data-id="PDE" transform="translate(123.79,283)"><rect x="-93.81" y="-39" width="187.62" height="78" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-13.1">Black–Scholes PDE</tspan><tspan x="0" y="4.9">∂C/∂t + ½σ²S² ∂²C/∂S²</tspan><tspan x="0" y="22.9">+ rS ∂C/∂S − rC = 0</tspan></text></g><g class="pele-node pele-shape-rect" data-id="RISK" transform="translate(123.79,409)"><rect x="-113.79" y="-39" width="227.58" height="78" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-13.1">風險中立定價</tspan><tspan x="0" y="4.9">C = e^(−rT) E^Q[max(S_T − K,</tspan><tspan x="0" y="22.9">0)]</tspan></text></g><g class="pele-node pele-shape-rect" data-id="D1D2" transform="translate(123.79,544)"><rect x="-104.46" y="-48" width="208.93" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-22.1">d1、d2</tspan><tspan x="0" y="-4.1">d1 = [ln(S/K) + (r + ½σ²)T] ÷</tspan><tspan x="0" y="13.9">(σ√T)</tspan><tspan x="0" y="31.9">d2 = d1 − σ√T</tspan></text></g><g class="pele-node pele-shape-rect outcome" data-id="BS" transform="translate(123.79,670)"><rect x="-111.67" y="-30" width="223.33" height="60" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);fill:#f5ead8;stroke:#a86d27;stroke-width:2px;"/><text class="pele-label" style="fill:#182426;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.1">Black–Scholes 公式</tspan><tspan x="0" y="13.9">C = S N(d1) − K e^(−rT) N(d2)</tspan></text></g><g class="pele-node pele-shape-rect" data-id="GREEKS" transform="translate(123.79,787)"><rect x="-96.57" y="-39" width="193.15" height="78" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-13.1">Greeks 與敏感度</tspan><tspan x="0" y="4.9">Delta、Gamma、Vega、</tspan><tspan x="0" y="22.9">Theta、Rho</tspan></text></g></g></svg>