var(--_s)" stroke="var(--_b)" style="rx:var(--_r);fill:#f5ead8;stroke:#a86d27;stroke-width:2px;"/><text class="pele-label" style="fill:#182426;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.1">CAPM</tspan><tspan x="0" y="13.9">E(Ri) = Rf + βi [E(Rm) − Rf]</tspan></text></g><g class="pele-node pele-shape-rect" data-id="SML" transform="translate(126.16,565)"><rect x="-69.34" y="-30" width="138.68" height="60" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.1">證券市場線 SML</tspan><tspan x="0" y="13.9">β 與必要報酬</tspan></text></g><g class="pele-node pele-shape-rect" data-id="BETA" transform="translate(338.42,565)"><rect x="-102.92" y="-22.5" width="205.85" height="45" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="4.9" text-anchor="middle">β = Cov(Ri, Rm) ÷ Var(Rm)</text></g><g class="pele-node pele-shape-rect" data-id="ALPHA" transform="translate(126.16,665.5)"><rect x="-116.16" y="-22.5" width="232.32" height="45" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="4.9" text-anchor="middle">α = 實際報酬 − CAPM 必要報酬</text></g></g></svg>