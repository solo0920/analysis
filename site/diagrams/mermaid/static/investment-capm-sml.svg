<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 452 698" width="452" height="698" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:14px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="static-investment-capm-sml-title" aria-describedby="static-investment-capm-sml-desc"><title id="static-investment-capm-sml-title">CAPM 與證券市場線推導地圖</title><desc id="static-investment-capm-sml-desc">從個別資產與效率前緣出發，加入無風險資產形成資本配置線，切點為市場投資組合，進而得到 CAPM、證券市場線與 α。</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_ASSETS_EF_0"><path d="M232.29,55L232.29,96"/><path class="pele-marker" d="M232.29,103L228.93,95L235.65,95Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_EF_CAL_0"><path d="M232.29,163L232.29,204"/><path class="pele-marker" d="M232.29,211L228.93,203L235.65,203Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_CAL_MKT_0"><path d="M232.29,271L232.29,312"/><path class="pele-marker" d="M232.29,319L228.93,311L235.65,311Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_MKT_CAPM_0"><path d="M232.29,379L232.29,420"/><path class="pele-marker" d="M232.29,427L228.93,419L235.65,419Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_CAPM_SML_0"><path d="M180.77,487C180.77,504.5 126.16,504.5 126.16,522L126.16,528"/><path class="pele-marker" d="M126.16,535L122.8,527L129.52,527Z" fill="